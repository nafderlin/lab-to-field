name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      # Only the lightweight inference stack: the tests run the exported ONNX models, no PyTorch needed.
      - run: pip install -r app/requirements.txt pytest
      - run: pytest -q
