name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      # Only the lightweight inference stack: the tests run the exported ONNX models, no PyTorch needed.
      - run: pip install -r app/requirements.txt pytest
      - run: pytest -q

  web:
    # The in-browser demo must preprocess photos exactly like Python, or its answers drift.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r app/requirements.txt
      - run: PYTHONPATH=src python web/test/make_fixtures.py build/web-fixtures
      - run: node --test web/test/
